env:  # 推理环境设置
  inference_env: real  # 选仿真还是真机 option: sim/real
  platform_type: "5w"  # 机器人型号 option: "4pro"/"5"/"5w"
  5w_wholebody: false  # 仅5w生效；在 observation.state/action 末尾追加并控制4维下半身
  5w_base_move: false  # 仅5w生效；从 action 末尾读取 [vx, vy, vyaw] 并发布 /cmd_vel
  5w_lowerlock: [0, 0, 0, 0]  # 全身模式下按 /lb_leg_traj index 锁定；1 会锁定对应关节并使用 go_bag_path 首帧值，0 正常运动。仅动最后一个设为 [1,1,1,0]；
  which_arm: both  # 控制左手、右手还是双手 option: both/left/right
  eef_type: qiangnao  # 夹爪或手型类型  option: leju_claw/qiangnao/sg100/rq2f85(仿真)
  ros_rate: 10  # 推理频率
  direct_to_wbc: false  # 是否使用direct to wbc模式。
  enable_action_interpolation: true
  control_rate: 100  # WBC插值后的实际控制指令频率
  execution_mode: inline  # inline/threaded；threaded 需 direct_to_wbc=true，用独立线程按 control_rate 独占下发
  image_size: [848, 480]  # 相机缩放尺寸 option: [640, 480](仿真)/[848, 480](真机）
  camera_encoding: h265  # 相机编码格式: "jpeg" 或 "h265"。h265 时自动订阅 H265 stream topic 并进行实时解码。

inference:  # 推理和评测设置
  go_bag_path: null    # bag 回放路径
  policy_type: client  # 要加载的模型类型,外挂模式选择client, 选择client模式后下面的pretrained_path失去作用
  pretrained_path: /path/to/checkpoint  # 要加载的权重路径。
  eval_episodes: 10  # 评测跑多少条
  max_episode_steps: 200  # 每条最多跑多少步
  task_prompt: "Pick and Place"

  async_inference: false  # true：推理与动作执行并行；false：保持同步推理
  actions_per_chunk: null  # null：本地使用 n_action_steps，远程使用服务返回长度
  chunk_size_threshold: 0.5  # 剩余动作比例 <= 此值时预取下一块
  aggregate_fn_name: exp  # latest_only / weighted_average / average / conservative / exp / cosine
  rtc_enabled: false  # 外挂 openpi / lingbotvla2 / groot；需 async_inference；DAgger 介入时保留模型前缀，松手时刷新
  rtc_mode: guided  # guided：现有权重通过 VJP 引导；trained：需重新进行 RTC 训练
  rtc_execution_horizon: 10  # 前缀引导长度，不裁剪返回 chunk；与 adapter execution_horizon 分开
  rtc_prefix_attention_schedule: exp  # zeros / ones / linear / exp；作用于模型去噪前缀
  rtc_max_guidance_weight: 10.0
  rtc_initial_delay_steps: 1  # 第一块之后的初始延迟估计，后续使用最近推理耗时估算

  # 选择 dagger 任务启用介入；是否录制由菜单选择。
  dagger_handover_duration: 0.3  # 模型→VR 渐变时间，单位 s，>=0；0 为直接切换。
  dagger_policy_handover_duration: 0.5  # 新模型动作就绪后的回切时间，单位 s，>=0；0 为直接交回。

  dagger_waist_on: false  # 可选 false/true；是否启用 VR 身体位姿＋grip 躯干介入。
  dagger_waist_pose_max_speed: 1.0  # 单位 rad/s，>0；自动传给 KRC 的躯干关节最大跟随速度，仅腰部介入时生效。

  rosbag_output_dir: outputs/dagger  # dagger 录制目录；相对路径以仓库根目录为基准，也可用绝对路径。
